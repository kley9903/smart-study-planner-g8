name: Publish website

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Check and publish main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Only publish the main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo 'Choose main when running Publish website.'
          exit 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - name: Verify deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Set the production environment secret CLOUDFLARE_API_TOKEN first.'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Set the production environment secret CLOUDFLARE_ACCOUNT_ID first.'; exit 1; }
      - name: Publish to the existing Cloudflare Pages project
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.153.0'
          command: pages deploy dist --project-name smart-study-planner-g8 --branch main
