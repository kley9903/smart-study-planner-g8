          <span class="brand__tag" data-en="Prototype v1">第一代原型</span>
        </span>
      </a>
      <nav class="top-nav" aria-label="主要頁面" data-en-label="Main pages">
        <a class="top-nav__link" href="#/week" data-nav="week"><svg class="i"><use href="#i-calendar"/></svg><span data-en="This week">本週</span></a>
        <a class="top-nav__link top-nav__link--margin" href="#/margin" data-nav="margin"><svg class="i"><use href="#i-note"/></svg><span data-en="Assistant">AI 助手</span><span class="top-nav__count" data-count hidden></span></a>

          <span class="demo-badge__short"><strong data-en="Leave tour">離開導覽</strong></span>
        </a>

        <button type="button" data-action="lang" data-lang-opt="zh" aria-pressed="false">中</button>
      </div>
